
on:
  push:
    branches:
      - PE-test
      
    
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Echo github variables
        id: get_ref
        run: |
          output_file="final_result"
          echo "brokers-dmx-prod-non-revenue-eks-2.kafka-us-east-1b.vungle.io 66" >> "\$output_file"
          echo "brokers-dmx-prod-non-revenue-eks-3.kafka-us-east-1b.vungle.io 78" >> "\$output_file"
          
          file_content=""
          while read -r line; do
            file_content+="\$line"\$'\n'  # Append line and add a newline character
          done < "\$output_file"
          
          echo "content=\$file_content" >> $GITHUB_OUTPUT
          
      # To be continue for run ANsible script  
      - name: Run Ansible playbook
        run: |
          echo "${{ steps.get_ref.outputs.content }}"
       